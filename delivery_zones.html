<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TomYumBar — Зоны доставки</title>

<!-- Leaflet CSS inline-bundled via unpkg -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f0f13;
  --card: #1a1a22;
  --border: #2a2a38;
  --accent: #ff6b35;
  --text: #f0ede8;
  --muted: #8a8799;
  --radius: 16px;
}
html, body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overflow: hidden;
}
.app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  height: 100vh;
}
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 9999;
}
.logo {
  font-size: 18px; font-weight: 800; color: var(--accent);
  margin-bottom: 8px; letter-spacing: -0.3px;
}
.logo span { color: var(--text); }
.search-wrap { position: relative; }
.search-input {
  width: 100%;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 11px 42px 11px 14px;
  font-size: 15px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }
.btn-clear {
  position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 17px;
  padding: 4px 6px; display: none;
}
.btn-clear.on { display: block; }

/* Suggestions dropdown */
.sug-box {
  display: none;
  position: absolute;
  top: calc(100% + 5px);
  left: 0; right: 0;
  background: #1e1e28;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  z-index: 99999;
  box-shadow: 0 10px 40px rgba(0,0,0,0.7);
  max-height: 220px;
  overflow-y: auto;
}
.sug-box.on { display: block; }
.sug-item {
  padding: 11px 14px;
  font-size: 14px; cursor: pointer;
  border-bottom: 1px solid #24242f;
  display: flex; gap: 8px; align-items: flex-start;
}
.sug-item:last-child { border: none; }
.sug-item:active, .sug-item:hover { background: #25252f; }
.sug-main { font-size: 14px; line-height: 1.3; }
.sug-sub { font-size: 11px; color: var(--muted); }
.sug-pin { color: var(--muted); margin-top:1px; flex-shrink:0; font-size:15px; }
.sug-loading {
  padding: 14px; text-align: center;
  color: var(--muted); font-size: 13px;
}

/* Result card */
.result {
  margin: 8px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--card);
  padding: 12px 14px;
  display: none;
  flex-shrink: 0;
  position: relative; z-index: 500;
  animation: fadeIn .2s ease;
}
.result.on { display: block; }
@keyframes fadeIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
.res-addr { font-size: 12px; color: var(--muted); margin-bottom: 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-body { display: flex; align-items: center; gap: 10px; }
.res-dot { width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25); flex-shrink:0; }
.res-price { font-size: 28px; font-weight: 800; letter-spacing: -1px; line-height:1; }
.res-lbl { font-size: 12px; color: var(--muted); }
.res-min {
  margin-left: auto; background: var(--bg);
  border-radius: 10px; padding: 6px 10px; text-align:center;
}
.res-min-v { font-size: 15px; font-weight: 700; }
.res-min-l { font-size: 10px; color: var(--muted); }

.nozone {
  margin: 8px 14px;
  border-radius: var(--radius);
  border: 1px solid #3a2020;
  background: #1a1015;
  padding: 12px 14px;
  display: none; gap: 10px; align-items: center;
  font-size: 14px; color: #ff9090;
  flex-shrink: 0; position: relative; z-index: 500;
}
.nozone.on { display: flex; }

/* Map container */
.map-wrap {
  flex: 1;
  min-height: 0;
  position: relative;
}
#map {
  width: 100%; height: 100%;
}

/* Legend */
.legend {
  position: absolute;
  bottom: 14px; right: 10px;
  z-index: 1000;
  background: rgba(15,15,19,0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12px;
}
.leg-title { font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--muted); margin-bottom:7px; }
.leg-row { display:flex; align-items:center; gap:7px; margin-bottom:5px; }
.leg-row:last-child { margin:0; }
.leg-sq { width:10px; height:10px; border-radius:3px; flex-shrink:0; }
.leg-p { font-weight:700; font-size:13px; min-width:44px; }
.leg-m { color:var(--muted); font-size:10px; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">🍜 Tom<span>Yum</span>Bar</div>
    <div class="search-wrap" id="sw">
      <input id="inp" class="search-input" type="search"
        placeholder="Улица и дом для проверки доставки…"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button id="clr" class="btn-clear">✕</button>
      <div id="sug" class="sug-box"></div>
    </div>
  </div>

  <div id="res" class="result">
    <div id="res-addr" class="res-addr"></div>
    <div class="res-body">
      <div id="res-dot" class="res-dot"></div>
      <div>
        <div id="res-price" class="res-price"></div>
        <div class="res-lbl">стоимость доставки</div>

      <div class="res-min">
        <div id="res-min" class="res-min-v"></div>
        <div class="res-min-l">мин. заказ</div>

  </div>

  <div id="noz" class="nozone">

      <div class="leg-row"><div class="leg-sq" style="background:#0e4779"></div><div class="leg-p">400 ₽</div><div class="leg-m">от 2 500</div></div>
    </div>
  </div>

</div>

// Draw zones

  style: function(f) {
    return {
      fillColor: f.properties.fill,
      fillOpacity: 0.4,
      color: f.properties.fill,
      weight: 1.5,
      opacity: 0.8
    };
  },
  onEachFeature: function(f, layer) {

      var desc = f.properties.description || '';

// ── POINT-IN-POLYGON ───────────────────────────────────────
function pip(px, py, ring) {
  var inside = false;
  for (var i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    var xi = ring[i][0], yi = ring[i][1];
    var xj = ring[j][0], yj = ring[j][1];
    if (((yi > py) !== (yj > py)) &&
        (px < (xj - xi) * (py - yi) / (yj - yi) + xi))
      inside = !inside;
  }
  return inside;
}

function findZone(lng, lat) {
  for (var k = 0; k < ZONES_GEOJSON.features.length; k++) {
    var f = ZONES_GEOJSON.features[k];
    var g = f.geometry;
    var polys = g.type === 'MultiPolygon' ? g.coordinates : [g.coordinates];
    for (var p = 0; p < polys.length; p++) {
      if (pip(lng, lat, polys[p][0])) return f.properties;
    }
  }
  return null;
}

function parseDesc(desc) {
  var pm = desc.match(/(\d+)\s*руб/);
  var mm = desc.match(/[Мм]иним[^\d]*(\d[\d\s]+)/);
  return {
    price: pm ? pm[1] + ' ₽' : '?',
    min:   mm ? mm[1].replace(/\s/g,'') + ' ₽' : '?'
  };
}

var inp  = document.getElementById('inp');
var clr  = document.getElementById('clr');
var sug  = document.getElementById('sug');
var res  = document.getElementById('res');
var noz  = document.getElementById('noz');
var marker = null;
var timer  = null;

function showResult(zone, addr) {
  var d = parseDesc(zone.description);
  document.getElementById('res-addr').textContent = addr;
  document.getElementById('res-price').textContent = d.price;
  document.getElementById('res-min').textContent = d.min;
  document.getElementById('res-dot').style.background = zone.fill;
  res.classList.add('on');
  noz.classList.remove('on');
}
function showNoZone() { res.classList.remove('on'); noz.classList.add('on'); }
function clearAll() {
  res.classList.remove('on');
  noz.classList.remove('on');
}

      + '?format=json&limit=6&addressdetails=1&accept-language=ru&countrycodes=ru'
      + '&q=' + encodeURIComponent(q + ' Омск');
    var r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var data = await r.json();
    render(data);
  } catch(e) {
    sug.innerHTML = '<div class="sug-loading" style="color:#ff9090">Ошибка: ' + e.message + '</div>';
  }
}

function render(items) {
  if (!items.length) {
    sug.innerHTML = '<div class="sug-loading">Ничего не найдено</div>';
    return;
  }
  sug._items = items;
  sug.innerHTML = items.map(function(r, i) {
    var road = r.address.road || r.address.pedestrian || r.address.neighbourhood || r.name || '';
    var num  = r.address.house_number ? ', ' + r.address.house_number : '';
    var sub  = r.address.suburb || r.address.city_district || r.address.city || '';
    return '<div class="sug-item" data-i="'+i+'">'
      + '<span class="sug-pin">📍</span>'
      + '<div><div class="sug-main">' + road + num + '</div>'
      + (sub ? '<div class="sug-sub">' + sub + '</div>' : '')
      + '</div></div>';
  }).join('');
}

sug.addEventListener('click', function(e) {
  var el = e.target.closest('[data-i]');
  if (!el) return;
  var r = sug._items[+el.dataset.i];
  pick(r);
});

function pick(r) {
  var lng = parseFloat(r.lon), lat = parseFloat(r.lat);
  var road = r.address.road || r.address.pedestrian || r.name || '';
  var num  = r.address.house_number ? ', ' + r.address.house_number : '';
  var addr = road + num;
  inp.value = addr;
  clr.classList.add('on');
  sug.classList.remove('on');

  if (marker) map.removeLayer(marker);
  var zone = findZone(lng, lat);

  var color = zone ? zone.fill : '#888888';
  var pinHtml = '<div style="width:20px;height:20px;background:'+color+';border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.6)"></div>';
  marker = L.marker([lat, lng], {
    icon: L.divIcon({ html: pinHtml, iconSize:[20,20], iconAnchor:[10,10], className:'' })
  }).addTo(map);

  map.flyTo([lat, lng], 16, { animate: true, duration: 0.7 });

  if (zone) showResult(zone, addr || r.display_name);
  else showNoZone();
}

// ── INPUT EVENTS ───────────────────────────────────────────
inp.addEventListener('input', function() {
  var q = inp.value.trim();
  clr.classList.toggle('on', q.length > 0);
  clearAll();
  if (q.length < 2) { sug.classList.remove('on'); return; }
  clearTimeout(timer);
  timer = setTimeout(function() { suggest(q); }, 500);
});

inp.addEventListener('focus', function() {
  if (inp.value.trim().length >= 2) sug.classList.add('on');
});

clr.addEventListener('click', function() {
  inp.value = '';
  clr.classList.remove('on');
  sug.classList.remove('on');
  clearAll();
  if (marker) { map.removeLayer(marker); marker = null; }
  inp.focus();
});

document.addEventListener('click', function(e) {
  if (!document.getElementById('sw').contains(e.target))
    sug.classList.remove('on');
});

inp.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { sug.classList.remove('on'); inp.blur(); }
});
</script>
</body>
</html>
